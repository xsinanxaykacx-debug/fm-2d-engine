<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FM 2D Live Simulation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10121a;color:#eee;font-family:Arial,sans-serif}
header{padding:14px 18px;background:#181a26;border-bottom:1px solid #303343}h1{margin:0 0 6px;font-size:20px}.muted{color:#9ea4b5;font-size:13px}
#app{max-width:1200px;margin:auto;padding:14px;display:grid;gap:10px}
canvas{display:block;width:100%;height:auto;background:#17633e;border:2px solid #555;border-radius:8px}
.controls,.stats{display:flex;flex-wrap:wrap;gap:8px}button{border:0;border-radius:6px;padding:10px 14px;background:#2b3042;color:#fff;font-weight:bold;cursor:pointer}button.primary{background:#218c58}button.danger{background:#a83d3d}
.stat{background:#181a26;border:1px solid #303343;border-radius:6px;padding:9px 12px;min-width:130px}.label{font-size:10px;color:#888}.value{font-size:16px;font-weight:bold;margin-top:3px}
#log{background:#181a26;border:1px solid #303343;border-radius:6px;padding:10px;font:12px Consolas,monospace;white-space:pre-wrap;color:#bfc5d4;min-height:90px}
#error{display:none;background:#401b1b;border:1px solid #a33;border-radius:6px;padding:12px;color:#ffb0b0;white-space:pre-wrap;font:12px Consolas,monospace}
</style>
</head>
<body>
<header><h1>FM 2D Live Simulation</h1><div id="status" class="muted">Hazırlanıyor...</div></header>
<main id="app">
<canvas id="field" width="1100" height="680"></canvas>
<div class="controls"><button id="start" class="primary">BAŞLAT</button><button id="stop">DURDUR</button><button id="step">1 TICK</button><button id="reset" class="danger">SIFIRLA</button></div>
<div class="stats">
<div class="stat"><div class="label">SKOR</div><div id="score" class="value">0 - 0</div></div>
<div class="stat"><div class="label">TICK</div><div id="tick" class="value">0</div></div>
<div class="stat"><div class="label">TOP SAHİBİ</div><div id="owner" class="value">#10</div></div>
<div class="stat"><div class="label">TOP HIZI</div><div id="speed" class="value">0.0</div></div>
<div class="stat"><div class="label">AKSİYON</div><div id="action" class="value">KICK-OFF</div></div>
</div>
<div id="log">Motor başlatılıyor...</div><div id="error"></div>
</main>
<script>
"use strict";
const PITCH={w:105,h:68,goalTop:29,goalBottom:39,dt:1/60};
const canvas=document.getElementById("field"),ctx=canvas.getContext("2d");
const statusEl=document.getElementById("status"),scoreEl=document.getElementById("score"),tickEl=document.getElementById("tick"),ownerEl=document.getElementById("owner"),speedEl=document.getElementById("speed"),actionEl=document.getElementById("action"),logEl=document.getElementById("log"),errorEl=document.getElementById("error");

let players=[],ball=null,running=false,raf=null,tickCount=0,homeScore=0,awayScore=0,lastAction="KICK-OFF",lastEvent="",clock=0;
let passCooldown=0,shotCooldown=0;

function makePlayers(){
 players=[
  {id:1,team:"HOME",role:"A",x:32,y:30,bx:32,by:30,vx:0,vy:0,attributes:{vision:90,passing:88,decision:92,dribbling:65,finishing:70,courage:75,composure:88}},
  {id:2,team:"HOME",role:"B",x:32,y:38,bx:32,by:38,vx:0,vy:0,attributes:{vision:65,passing:68,decision:60,dribbling:84,finishing:82,courage:86,composure:72}},
  {id:3,team:"AWAY",role:"A",x:73,y:38,bx:73,by:38,vx:0,vy:0,attributes:{vision:84,passing:82,decision:86,dribbling:70,finishing:76,courage:72,composure:84}},
  {id:4,team:"AWAY",role:"B",x:73,y:30,bx:73,by:30,vx:0,vy:0,attributes:{vision:62,passing:64,decision:58,dribbling:88,finishing:80,courage:90,composure:70}}
 ];
}

function resetBall(team="HOME"){
 const id=team==="HOME"?1:3,p=player(id);
 ball={owner:id,x:p.x,y:p.y,vx:0,vy:0,targetId:null,passTeam:null,passerId:null};
 passCooldown=1.0;shotCooldown=1.0;
}

function reset(){
 stop();makePlayers();tickCount=0;clock=0;homeScore=0;awayScore=0;lastAction="KICK-OFF";lastEvent="";clearError();resetBall("HOME");statusEl.textContent="Hazır — 2 vs 2";render();updateUI();
}
function player(id){return players.find(p=>p.id===id)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function teamPlayers(team){return players.filter(p=>p.team===team)}
function moveToward(p,tx,ty,speed){
 const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
 if(d<.05){p.vx=0;p.vy=0;return}
 const step=Math.min(d,speed*PITCH.dt);
 p.vx=dx/d*speed;p.vy=dy/d*speed;p.x+=dx/d*step;p.y+=dy/d*step;
 p.x=clamp(p.x,3,102);p.y=clamp(p.y,3,65);
}
function nearestOpponent(p){
 let best=null,bd=Infinity;
 for(const q of players)if(q.team!==p.team){const d=dist(p,q);if(d<bd){bd=d;best=q}}
 return {p:best,d:bd};
}
function nearestMate(p){
 let best=null,bd=Infinity;
 for(const q of teamPlayers(p.team))if(q.id!==p.id){const d=dist(p,q);if(d<bd){bd=d;best=q}}
 return {p:best,d:bd};
}

function perceivePlayer(p){
 const dir=p.team==="HOME"?1:-1,goalX=p.team==="HOME"?105:0;
 const opp=nearestOpponent(p),mate=nearestMate(p);
 const visibleOpponents=players.filter(q=>q.team!==p.team&&dist(p,q)<32);
 const visibleMates=teamPlayers(p.team).filter(q=>q.id!==p.id&&dist(p,q)<35);

 const teammates=visibleMates.map(m=>{
  const md=nearestOpponent(m).d;
  const forward=(m.x-p.x)*dir;
  return {
   playerId:m.id,
   distance:dist(p,m),
   forward,
   pressure:md,
   visibility:clamp(100-dist(p,m)*2.2,15,100),
   passSafety:clamp(md*9,0,100),
   attackingValue:clamp(50+forward*5+(goalX===105?105-m.x:m.x)*-0.7,0,100)
  };
 });

 let forwardSpace=100;
 for(const q of visibleOpponents){
  const forward=(q.x-p.x)*dir;
  const lateral=Math.abs(q.y-p.y);
  if(forward>0&&forward<14&&lateral<8){
   forwardSpace=Math.min(forwardSpace,clamp(forward/14*100,0,100));
  }
 }

 const goalDist=Math.abs(goalX-p.x);
 const shotAngle=clamp(100-Math.abs(p.y-34)*4.8,20,100);

 return {
  pressure:clamp((12-opp.d)*8,0,100),
  nearestOpponent:opp.p?opp.p.id:null,
  opponentDistance:opp.d,
  forwardSpace,
  goalDistance:goalDist,
  shotAngle,
  teammates,
  visibleOpponents:visibleOpponents.map(q=>({id:q.id,distance:dist(p,q)})),
  dangerBehind:clamp((8-((p.x-(p.team==="HOME"?3:102))*dir))*8,0,100)
 };
}

function thinkPlayer(p,perception){
 const attributes=p.attributes||{vision:70,passing:70,decision:70,dribbling:70,finishing:70,courage:70,composure:70};
 const pressure=perception.pressure;

 const options=perception.teammates.map(m=>{
  let laneRisk=0;
  const receiver=player(m.playerId);
  if(receiver){
   for(const q of players){
    if(q.team===p.team)continue;
    const ax=p.x,ay=p.y,bx=receiver.x,by=receiver.y;
    const abx=bx-ax,aby=by-ay,len2=abx*abx+aby*aby;
    if(len2<.01)continue;
    const t=clamp(((q.x-ax)*abx+(q.y-ay)*aby)/len2,0,1);
    const px=ax+abx*t,py=ay+aby*t;
    const ld=Math.hypot(q.x-px,q.y-py);
    if(ld<4)laneRisk=Math.max(laneRisk,1-ld/4);
   }
  }

  const visionBonus=attributes.vision*.14;
  const decisionBonus=attributes.decision*.16;
  const safety=m.passSafety*.26;
  const forward=clamp(50+m.forward*4,0,100)*.14;
  const attacking=m.attackingValue*.08;
  const lane=(100-laneRisk*85)*.12;

  // Baskı altındaki oyuncu için en yakın güvenli takım arkadaşının
  // yana/geriye değil, baskıdan çıkış sağlayan pası ciddi şekilde değerlenir.
  const escapeValue=pressure>55
    ? clamp((12-m.distance)*6,0,72)*.32
    : clamp((12-m.distance)*4,0,48)*.12;

  // Arkadaşın biraz aşağıda/yanında olması, ileri olmamasına rağmen
  // baskıdan çıkış pasıysa cezalandırılmaz.
  const nearbyEscape=(pressure>55 && m.distance<11 && m.pressure>6)
    ? 12 : 0;

  return {
   type:"PASS",
   target:m.playerId,
   score:clamp(
    visionBonus+decisionBonus+safety+forward+attacking+lane+escapeValue+nearbyEscape,
    0,100
   ),
   reason:pressure>55 && m.distance<11
    ?"BASKIDAN ÇIKIŞ PASI"
    :(m.pressure>70?"ARKADAŞ AÇIK":m.forward>5?"İLERİ PAS":"GÜVENLİ PAS")
  };
 });

 const shotSpace=clamp(100-perception.opponentDistance*7,0,100);
 const shot={
  type:"SHOT",
  score:clamp(
   (clamp(100-(perception.goalDistance-8)*4.5,0,100)*.42)+
   (perception.shotAngle*.18)+
   (shotSpace*.15)+
   (attributes.finishing*.15)+
   (attributes.composure*.10),
   0,100
  ),
  reason:"ŞUT AÇISI VE MESAFE"
 };

 const dribble={
  type:"DRIBBLE",
  score:clamp(
   perception.forwardSpace*.38+
   clamp(perception.opponentDistance*8,0,100)*.22+
   attributes.dribbling*.20+
   attributes.courage*.10+
   attributes.decision*.10,
   0,100
  ),
  reason:perception.forwardSpace>65?"ÖNÜ AÇIK":"BİRE BİR FIRSATI"
 };

 return {passes:options,shot,dribble};
}

function decidePlayer(p,thought){
 const options=[...thought.passes,thought.shot,thought.dribble]
  .filter(o=>o.score>=0)
  .sort((a,b)=>b.score-a.score);

 if(!options.length)return {type:"DRIBBLE",score:0,reason:"VARSAYILAN"};

 const best=options[0],second=options[1];

 // Oyuncu düşünür; tamamen deterministik değil ama karar rastgele değildir.
 const uncertainty=Math.max(0,(100-(p.attributes?.decision||70))/100);
 if(second&&best.score-second.score<4&&Math.random()<.10+uncertainty*.15){
  return {...second,confidence:Math.round(second.score)};
 }
 return {...best,confidence:Math.round(best.score)};
}

function passTo(carrier,receiver){
 if(!carrier||!receiver)return false;
 const dir=carrier.team==="HOME"?1:-1;
 const lead=Math.min(4.5,dist(carrier,receiver)*0.22);
 const tx=clamp(receiver.x+dir*lead,3,102);
 const ty=clamp(receiver.y,3,65);
 const dx=tx-carrier.x,dy=ty-carrier.y,d=Math.hypot(dx,dy)||1;
 ball.owner=null;
 ball.x=carrier.x;ball.y=carrier.y;
 ball.vx=dx/d*18;ball.vy=dy/d*18;
 ball.targetId=receiver.id;
 ball.passTeam=carrier.team;
 ball.passerId=carrier.id;
 passCooldown=0.8;
 lastAction="PAS #"+carrier.id+" → #"+receiver.id;
 return true;
}

function shoot(carrier){
 if(!carrier)return false;
 const gx=carrier.team==="HOME"?105:0;
 const gy=34+(Math.random()-0.5)*5;
 const dx=gx-carrier.x,dy=gy-carrier.y,d=Math.hypot(dx,dy)||1;
 ball.owner=null;
 ball.x=carrier.x;ball.y=carrier.y;
 ball.vx=dx/d*23;ball.vy=dy/d*23;
 ball.targetId=null;
 ball.passTeam=carrier.team;
 ball.passerId=carrier.id;
 shotCooldown=1.4;
 passCooldown=0.6;
 lastAction="ŞUT #"+carrier.id;
 return true;
}

function executePlayerDecision(p,decision){
 if(decision.type==="SHOT"&&shotCooldown<=0){
  shoot(p);
  lastAction="#"+p.id+" DÜŞÜNDÜ → ŞUT";
  return true;
 }

 if(decision.type==="PASS"&&decision.target){
  const receiver=player(decision.target);

  if(receiver){
   // Oyuncu PAS seçtiyse karar bozulup otomatik SÜR'e dönmez.
   // Pas cooldown'ı dolana kadar baskıdan çıkacak küçük bir konum değişikliği yapar.
   if(passCooldown<=0){
    passTo(p,receiver);
    lastAction="#"+p.id+" DÜŞÜNDÜ → PAS #"+receiver.id;
    return true;
   }

   const dir=p.team==="HOME"?1:-1;
   const opp=nearestOpponent(p);
   const dx=receiver.x-p.x;
   const dy=receiver.y-p.y;

   // Rakip baskısından uzaklaş; aynı zamanda alıcıyla görüş hattını koru.
   let tx=p.x;
   let ty=p.y;

   if(opp.p&&opp.d<9){
    const awayX=p.x-(opp.p.x-p.x)*0.55;
    const awayY=p.y-(opp.p.y-p.y)*0.55;
    tx=awayX;
    ty=awayY;
   }else{
    tx=p.x+clamp(dx*0.18,-1.5,1.5);
    ty=p.y+clamp(dy*0.18,-2.0,2.0);
   }

   tx=clamp(tx,3,102);
   ty=clamp(ty,3,65);
   moveToward(p,tx,ty,4.8);
   updateOwnedBall();
   lastAction="#"+p.id+" PASI BEKLİYOR → #"+receiver.id;
   return true;
  }
 }

 // Ancak gerçekten PAS/ŞUT seçilmemişse sür.
 const dir=p.team==="HOME"?1:-1;
 const opp=nearestOpponent(p);
 let tx=p.x+dir*4.2,ty=p.y;

 if(opp.p&&opp.d<8){
  const escape= p.y<=opp.p.y ? -1 : 1;
  ty=p.y+escape*5.5;
  tx=p.x+dir*1.2;
 }

 tx=clamp(tx,3,102);
 ty=clamp(ty,3,65);

 moveToward(p,tx,ty,6.8);
 updateOwnedBall();
 lastAction="#"+p.id+" DÜŞÜNDÜ → SÜR";
 return true;
}
function updateCarrier(){
 if(ball.owner==null)return;
 const p=player(ball.owner);if(!p){ball.owner=null;return}

 const perception=perceivePlayer(p);
 const thought=thinkPlayer(p,perception);
 const decision=decidePlayer(p,thought);

 // Karar bilgisi oyuncunun zihinsel durumunu görünür kılar.
 p.lastThought={
  perception,
  thought,
  decision,
  tick:tickCount
 };

 executePlayerDecision(p,decision);
}

function updatePlayers(){
 const owner=ball.owner,bp=owner?player(owner):null;
 for(const p of players){
  if(p.id===owner)continue;
  let tx=p.bx,ty=p.by;
  const dir=p.team==="HOME"?1:-1;
  if(bp && bp.team===p.team){
    const mate=bp;
    const d=dist(p,mate);
    // Hücum destek açısı: top sahibinden uzaklaşıp pas koridoru aç.
    tx=mate.x+dir*7;
    ty=p.by<34?mate.y-7:mate.y+7;

    // Hücum oyuncusu rakip yarı sahaya yaklaşınca destek oyuncusu
    // top sahibinin arkasına değil, pas açısına çıkar.
    if((mate.team==="HOME"&&mate.x>58)||(mate.team==="AWAY"&&mate.x<47)){
      tx=mate.x-dir*2;
      ty=mate.y+(p.by<34?-8:8);
    }

    tx=clamp(tx,3,102);
    ty=clamp(ty,3,65);
  }else if(bp && bp.team!==p.team){
    const opp=bp,d=dist(p,opp);
    // En yakın savunmacı baskı yapar, diğeri pas yolunu kapatır.
    const mate=nearestMate(p).p;
    const mateD=mate?dist(mate,opp):999;
    if(d<=mateD+1){
      tx=opp.x;ty=opp.y;
    }else{
      tx=(opp.x+p.bx)/2;
      ty=(opp.y+p.by)/2;
    }
  }else{
    // Top serbestse en yakın oyuncu topa, diğeri destek pozisyonuna.
    const d=dist(p,ball),mate=nearestMate(p).p,mateD=mate?dist(mate,ball):999;
    if(d<=mateD) {tx=ball.x;ty=ball.y}
    else {tx=p.bx+(ball.x-p.bx)*.25;ty=p.by+(ball.y-p.by)*.25}
  }
  moveToward(p,tx,ty,p.role==="A"?7.0:6.6);
 }
 separate();
}

function separate(){
 const minD=3.0;
 for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){
  const a=players[i],b=players[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
  if(d>0&&d<minD){
   const push=(minD-d)/2,nx=dx/d,ny=dy/d;
   a.x=clamp(a.x-nx*push,3,102);a.y=clamp(a.y-ny*push,3,65);
   b.x=clamp(b.x+nx*push,3,102);b.y=clamp(b.y+ny*push,3,65);
  }
 }
}


function updateOwnedBall(){
 if(ball.owner!=null){const p=player(ball.owner);if(p){ball.x=p.x;ball.y=p.y;ball.vx=0;ball.vy=0}}
}

function updateFreeBall(){
 if(ball.owner!=null)return;
 ball.x+=ball.vx*PITCH.dt;ball.y+=ball.vy*PITCH.dt;ball.vx*=.985;ball.vy*=.985;
 const speed=Math.hypot(ball.vx,ball.vy);
 if(ball.targetId!=null){
  const r=player(ball.targetId);
  if(r&&dist(r,ball)<3.5){ball.owner=r.id;ball.x=r.x;ball.y=r.y;ball.vx=0;ball.vy=0;lastAction="KONTROL #"+r.id;return}
 }
 for(const p of players){
  if(dist(p,ball)<2.0&&speed<22){ball.owner=p.id;ball.x=p.x;ball.y=p.y;ball.vx=0;ball.vy=0;lastAction="TOP #"+p.id;return}
 }
 const goalY=ball.y>=PITCH.goalTop&&ball.y<=PITCH.goalBottom;
 if(ball.x<0||ball.x>PITCH.w||ball.y<0||ball.y>PITCH.h){
  if((ball.x<0||ball.x>PITCH.w)&&goalY){
   const scoring=ball.x<0?"AWAY":"HOME";
   if(scoring==="HOME")homeScore++;else awayScore++;
   lastEvent="GOOOL — "+scoring;
   resetMatch(scoring==="HOME"?"AWAY":"HOME");return;
  }
  lastEvent="OYUN DIŞI";resetMatch(ball.passTeam==="HOME"?"AWAY":"HOME");return;
 }
 if(speed<.7){
  let best=players[0],bd=Infinity;
  for(const p of players){const d=dist(p,ball);if(d<bd){bd=d;best=p}}
  ball.owner=best.id;lastAction="TOP KAZANILDI #"+best.id;
 }
}

function resetMatch(team){
 makePlayers();resetBall(team);
}

function tick(){
 try{
  for(let i=0;i<2;i++){
   tickCount++;clock+=PITCH.dt;passCooldown-=PITCH.dt;shotCooldown-=PITCH.dt;
   updatePlayers();updateCarrier();updateFreeBall();updateOwnedBall();
  }
  render();updateUI();
 }catch(e){fail(e)}
}
function frame(){if(!running)return;tick();raf=requestAnimationFrame(frame)}
function start(){if(running)return;running=true;statusEl.textContent="CANLI — 2 vs 2";raf=requestAnimationFrame(frame)}
function stop(){running=false;if(raf!==null)cancelAnimationFrame(raf);raf=null;statusEl.textContent="Durduruldu"}

function drawPitch(){
 ctx.clearRect(0,0,1100,680);ctx.fillStyle="#17633e";ctx.fillRect(0,0,1100,680);
 ctx.strokeStyle="rgba(255,255,255,.88)";ctx.lineWidth=3;ctx.strokeRect(50,40,1000,600);
 ctx.beginPath();ctx.moveTo(550,40);ctx.lineTo(550,640);ctx.stroke();
 ctx.beginPath();ctx.arc(550,340,90,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.arc(550,340,4,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
 ctx.strokeRect(50,210,140,260);ctx.strokeRect(910,210,140,260);ctx.strokeRect(50,275,55,130);ctx.strokeRect(995,275,55,130);
 ctx.strokeRect(20,290,30,100);ctx.strokeRect(1050,290,30,100);
}
function sx(x){return 50+x*(1000/PITCH.w)}
function sy(y){return 40+y*(600/PITCH.h)}
function drawPlayer(p){
 const x=sx(p.x),y=sy(p.y),r=18,own=ball.owner===p.id;
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=p.team==="HOME"?"#2584ff":"#e64747";ctx.fill();
 ctx.strokeStyle=own?"#ffd84d":"#fff";ctx.lineWidth=own?4:2;ctx.stroke();
 ctx.fillStyle="#fff";ctx.font="bold 12px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(String(p.id),x,y);
}
function drawBall(){
 const x=sx(ball.x),y=sy(ball.y);ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.strokeStyle="#111";ctx.lineWidth=2;ctx.stroke();
}
function render(){drawPitch();for(const p of players)drawPlayer(p);drawBall()}
function updateUI(){
 const s=Math.hypot(ball.vx,ball.vy);
 scoreEl.textContent=homeScore+" - "+awayScore;tickEl.textContent=String(tickCount);ownerEl.textContent=ball.owner==null?"SAHİPSİZ":"#"+ball.owner;speedEl.textContent=s.toFixed(1);actionEl.textContent=lastAction;
 const op=ball.owner?player(ball.owner):null;
 const mental=op?.lastThought;
const mentalLines=mental?[
 "DÜŞÜNCE:",
 "  Baskı: "+mental.perception.pressure.toFixed(0),
 "  Ön alan: "+mental.perception.forwardSpace.toFixed(0),
 "  Kaleye: "+mental.perception.goalDistance.toFixed(1),
 "  Karar: "+mental.decision.type+(mental.decision.target?" #"+mental.decision.target:""),
 "  Güven: %"+mental.decision.confidence,
 "  Neden: "+mental.decision.reason
]:[];
logEl.textContent=[
 "Oyun süresi: "+Math.floor(clock/60)+":"+String(Math.floor(clock%60)).padStart(2,"0"),
 "Top: "+(ball.owner==null?"SERBEST":"#"+ball.owner+" "+(op?op.team:"")),
 "Top: "+ball.x.toFixed(1)+", "+ball.y.toFixed(1),
 "Aksiyon: "+lastAction,
 ...mentalLines,
 lastEvent||""
].filter(Boolean).join("\n");
}
function fail(e){stop();errorEl.style.display="block";errorEl.textContent=e?.stack||String(e);console.error(e)}
function clearError(){errorEl.style.display="none";errorEl.textContent=""}
document.getElementById("start").onclick=start;
document.getElementById("stop").onclick=stop;
document.getElementById("step").onclick=tick;
document.getElementById("reset").onclick=reset;
reset();
</script>
