<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FM 2D Live Simulation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10121a;color:#eee;font-family:Arial,sans-serif}
header{padding:14px 18px;background:#181a26;border-bottom:1px solid #303343}h1{margin:0 0 6px;font-size:20px}.muted{color:#9ea4b5;font-size:13px}
#app{max-width:1200px;margin:auto;padding:14px;display:grid;gap:10px}
canvas{display:block;width:100%;height:auto;background:#17633e;border:2px solid #555;border-radius:8px}
.controls,.stats{display:flex;flex-wrap:wrap;gap:8px}button{border:0;border-radius:6px;padding:10px 14px;background:#2b3042;color:#fff;font-weight:bold;cursor:pointer}button.primary{background:#218c58}button.danger{background:#a83d3d}
.stat{background:#181a26;border:1px solid #303343;border-radius:6px;padding:9px 12px;min-width:130px}.label{font-size:10px;color:#888}.value{font-size:16px;font-weight:bold;margin-top:3px}
#log{background:#181a26;border:1px solid #303343;border-radius:6px;padding:10px;font:12px Consolas,monospace;white-space:pre-wrap;color:#bfc5d4;min-height:90px}
#error{display:none;background:#401b1b;border:1px solid #a33;border-radius:6px;padding:12px;color:#ffb0b0;white-space:pre-wrap;font:12px Consolas,monospace}
</style>
</head>
<body>
<header><h1>FM 2D Live Simulation</h1><div id="status" class="muted">Hazırlanıyor...</div></header>
<main id="app">
<canvas id="field" width="1100" height="680"></canvas>
<div class="controls"><button id="start" class="primary">BAŞLAT</button><button id="stop">DURDUR</button><button id="step">1 TICK</button><button id="reset" class="danger">SIFIRLA</button></div>
<div class="stats">
<div class="stat"><div class="label">SKOR</div><div id="score" class="value">0 - 0</div></div>
<div class="stat"><div class="label">TICK</div><div id="tick" class="value">0</div></div>
<div class="stat"><div class="label">TOP SAHİBİ</div><div id="owner" class="value">#10</div></div>
<div class="stat"><div class="label">TOP HIZI</div><div id="speed" class="value">0.0</div></div>
<div class="stat"><div class="label">AKSİYON</div><div id="action" class="value">KICK-OFF</div></div>
</div>
<div id="log">Motor başlatılıyor...</div><div id="error"></div>
</main>
<script>
"use strict";

const PITCH={w:105,h:68,goalTop:29,goalBottom:39,dt:1/60};
const canvas=document.getElementById("field"),ctx=canvas.getContext("2d");
const statusEl=document.getElementById("status"),scoreEl=document.getElementById("score"),tickEl=document.getElementById("tick"),ownerEl=document.getElementById("owner"),speedEl=document.getElementById("speed"),actionEl=document.getElementById("action"),logEl=document.getElementById("log"),errorEl=document.getElementById("error");

let players=[],ball=null,running=false,raf=null,tickCount=0,homeScore=0,awayScore=0,lastAction="KICK-OFF",lastEvent="",clock=0;
let passCooldown=0,shotCooldown=0;

const roles=["GK","LB","LCB","RCB","RB","LM","LCM","RCM","RM","ST","ST"];
const formationHome=[[5,34],[16,12],[16,27],[16,41],[16,56],[32,13],[32,28],[32,40],[32,55],[48,27],[48,41]];
const formationAway=formationHome.map(([x,y])=>[105-x,y]);

function makePlayers(){
 players=[];
 formationHome.forEach((p,i)=>players.push({id:i+1,team:"HOME",role:roles[i],x:p[0],y:p[1],bx:p[0],by:p[1],vx:0,vy:0,stamina:1}));
 formationAway.forEach((p,i)=>players.push({id:i+12,team:"AWAY",role:roles[i],x:p[0],y:p[1],bx:p[0],by:p[1],vx:0,vy:0,stamina:1}));
}

function resetBall(team="HOME"){
 const id=team==="HOME"?10:21;
 const p=players.find(x=>x.id===id);
 ball={owner:id,x:p.x,y:p.y,vx:0,vy:0,targetId:null,passTeam:null,passerId:null};
 passCooldown=0.8;shotCooldown=1.2;
}

function reset(){
 stop();makePlayers();tickCount=0;clock=0;homeScore=0;awayScore=0;lastAction="KICK-OFF";lastEvent="";resetBall("HOME");clearError();statusEl.textContent="Hazır — 22 oyuncu + top";render();updateUI();
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function player(id){return players.find(p=>p.id===id)}
function teamPlayers(team){return players.filter(p=>p.team===team)}
function opponents(team){return players.filter(p=>p.team!==team)}

function moveToward(p,tx,ty,speed){
 const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
 if(d<0.01){p.vx=0;p.vy=0;return}
 const step=Math.min(d,speed*PITCH.dt);
 p.vx=dx/d*step/PITCH.dt;p.vy=dy/d*step/PITCH.dt;
 p.x+=dx/d*step;p.y+=dy/d*step;
 p.x=clamp(p.x,1,104);p.y=clamp(p.y,1,67);
}

function nearestOpponent(p){
 let best=null,bd=Infinity;
 for(const q of opponents(p.team)){const d=dist(p,q);if(d<bd){bd=d;best=q}}
 return {p:best,d:bd};
}

function tacticalTarget(p,owner){
 const dir=p.team==="HOME"?1:-1;
 let x=p.bx,y=p.by;
 const ballPlayer=owner?player(owner):null;
 if(ballPlayer){
   const ballPressure=Math.max(0,1-dist(p,ballPlayer)/35);
   x+=(ballPlayer.x-52.5)*0.18*ballPressure;
   y+=(ballPlayer.y-34)*0.12*ballPressure;
 }
 if(p.role==="ST") x+=dir*7;
 if(p.role==="LM"||p.role==="RM") x+=dir*3;
 if(p.role==="GK") x=p.bx;
 return {x:clamp(x,2,103),y:clamp(y,2,66)};
}

function choosePass(carrier){
 const mates=teamPlayers(carrier.team).filter(p=>p.id!==carrier.id&&p.role!=="GK");
 const dir=carrier.team==="HOME"?1:-1;
 const candidates=mates.map(p=>{
   const opp=nearestOpponent(p).d;
   const forward=(p.x-carrier.x)*dir;
   const d=dist(carrier,p);
   const lane=Math.abs(p.y-carrier.y);
   return {p,score:opp*1.4+forward*0.9-lane*0.15-d*0.25,d,forward};
 }).filter(c=>c.d<42||c.forward>0);
 if(!candidates.length)return null;
 candidates.sort((a,b)=>b.score-a.score);
 return candidates[0].p;
}

function pressure(carrier){
 const o=nearestOpponent(carrier);
 return o.d<9;
}

function pass(carrier){
 const receiver=choosePass(carrier);
 if(!receiver)return false;
 const dx=receiver.x-carrier.x,dy=receiver.y-carrier.y,d=Math.hypot(dx,dy)||1;
 const lead=Math.min(4,d*0.18);
 const tx=receiver.x+(receiver.vx||0)*lead*0.12;
 const ty=receiver.y+(receiver.vy||0)*lead*0.12;
 const pdx=tx-carrier.x,pdy=ty-carrier.y,pd=Math.hypot(pdx,pdy)||1;
 const dirx=pdx/pd,diry=pdy/pd;
 ball.owner=null;ball.x=carrier.x;ball.y=carrier.y;
 ball.vx=dirx*24+((receiver.vx||0)*0.25);
 ball.vy=diry*24+((receiver.vy||0)*0.25);
 ball.targetId=receiver.id;ball.passTeam=carrier.team;ball.passerId=carrier.id;
 lastAction="PASS #"+carrier.id+" → #"+receiver.id;
 passCooldown=0.65;
 return true;
}

function shoot(carrier){
 const goalX=carrier.team==="HOME"?105:0,gy=34+(Math.random()-0.5)*5;
 const dx=goalX-carrier.x,dy=gy-carrier.y,d=Math.hypot(dx,dy)||1;
 ball.owner=null;ball.x=carrier.x;ball.y=carrier.y;ball.vx=dx/d*27;ball.vy=dy/d*27;ball.targetId=null;ball.passTeam=carrier.team;ball.passerId=carrier.id;
 lastAction="ŞUT #"+carrier.id;shotCooldown=1.3;passCooldown=0.7;
}

function updateOwnedBall(){
 if(ball.owner!=null){const p=player(ball.owner);if(p){ball.x=p.x;ball.y=p.y;ball.vx=0;ball.vy=0}}
}

function updatePlayers(){
 const owner=ball.owner, bp=owner?player(owner):null;
 const freeChasers=[];
 if(owner==null){
   const ranked=players.map(p=>({p,d:dist(p,ball)})).sort((a,b)=>a.d-b.d);
   ranked.slice(0,2).forEach(x=>freeChasers.push(x.p.id));
 }
 for(const p of players){
   if(p.id===owner)continue;
   const t=tacticalTarget(p,owner);
   let tx=t.x,ty=t.y;
   if(owner==null && ball.passTeam!==null){
     if(freeChasers.includes(p.id)){
       tx=ball.x;ty=ball.y;
     }
   } else if(bp && p.team!==bp.team){
     const sameTeam=teamPlayers(p.team);
     const pressers=sameTeam
       .map(q=>({q,d:dist(q,bp)}))
       .sort((a,b)=>a.d-b.d)
       .slice(0,2)
       .map(x=>x.q.id);
     if(pressers.includes(p.id) && dist(p,bp)<18){
       tx=bp.x;ty=bp.y;
     }
   }
   const speed=p.role==="GK"?4.0:6.5;
   moveToward(p,tx,ty,speed);
 }
 separatePlayers();
}

function separatePlayers(){
 const minD=2.8;
 for(let i=0;i<players.length;i++){
   for(let j=i+1;j<players.length;j++){
     const a=players[i],b=players[j];
     if(a.id===ball.owner||b.id===ball.owner)continue;
     const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
     if(d>0&&d<minD){
       const push=(minD-d)/2;
       const nx=dx/d,ny=dy/d;
       a.x=clamp(a.x-nx*push,1,104);
       a.y=clamp(a.y-ny*push,1,67);
       b.x=clamp(b.x+nx*push,1,104);
       b.y=clamp(b.y+ny*push,1,67);
     }
   }
 }
}

function updateCarrier(){
 if(ball.owner==null)return;
 const p=player(ball.owner);if(!p){ball.owner=null;return}
 const dir=p.team==="HOME"?1:-1;
 const goalX=p.team==="HOME"?105:0;
 const goalDist=Math.abs(goalX-p.x);
 const pressureInfo=nearestOpponent(p);
 const shouldShoot=p.role==="ST"&&goalDist<25&&shotCooldown<=0&&pressureInfo.d>3.5;
 if(shouldShoot){shoot(p);return}
 if(passCooldown<=0&&(pressureInfo.d<8.5||Math.random()<0.018)){
   if(pass(p))return;
 }
 let tx=p.x+dir*5,ty=p.y;
 if(pressureInfo.d<7){tx=p.x-dir*4;ty=p.y+(p.y<34?4:-4)}
 moveToward(p,tx,ty,7.2);
 updateOwnedBall();
}

function updateFreeBall(){
 if(ball.owner!=null)return;
 ball.x+=ball.vx*PITCH.dt;ball.y+=ball.vy*PITCH.dt;
 ball.vx*=0.992;ball.vy*=0.992;
 const speed=Math.hypot(ball.vx,ball.vy);

 if(ball.targetId!=null){
   const r=player(ball.targetId);
   if(r&&dist(r,ball)<4.5){
     ball.owner=r.id;ball.x=r.x;ball.y=r.y;ball.vx=0;ball.vy=0;lastAction="KONTROL #"+r.id;
     return;
   }
 }
 for(const p of players){
   const d=dist(p,ball);
   if(d<1.9&&speed<24){
     ball.owner=p.id;ball.x=p.x;ball.y=p.y;ball.vx=0;ball.vy=0;lastAction="KAZANILDI #"+p.id;return;
   }
 }
 const goalY=ball.y>=PITCH.goalTop&&ball.y<=PITCH.goalBottom;
 if(ball.x<0||ball.x>PITCH.w||ball.y<0||ball.y>PITCH.h){
   if((ball.x<0||ball.x>PITCH.w)&&goalY){
     const scoring=ball.x<0?"AWAY":"HOME";
     if(scoring==="HOME")homeScore++;else awayScore++;
     lastEvent="GOOOL — "+scoring;
     const restartTeam=scoring==="HOME"?"AWAY":"HOME";
     makePlayers();resetBall(restartTeam);return;
   }
   const restartTeam=ball.passTeam==="HOME"?"AWAY":"HOME";
   lastEvent="TAÇ / OYUN DIŞI";
   makePlayers();resetBall(restartTeam);return;
 }
 if(speed<0.7){
   let nearest=players[0],bd=Infinity;
   for(const p of players){const d=dist(p,ball);if(d<bd){bd=d;nearest=p}}
   ball.owner=nearest.id;ball.x=nearest.x;ball.y=nearest.y;ball.vx=0;ball.vy=0;lastAction="TOP KAZANILDI #"+nearest.id;
 }
}

function tick(){
 try{
   const steps=2;
   for(let i=0;i<steps;i++){
     tickCount++;clock+=PITCH.dt;passCooldown-=PITCH.dt;shotCooldown-=PITCH.dt;
     updatePlayers();
     updateCarrier();
     updateFreeBall();
     updateOwnedBall();
   }
   render();updateUI();
 }catch(e){fail(e)}
}

function frame(){if(!running)return;tick();raf=requestAnimationFrame(frame)}
function start(){if(running)return;running=true;statusEl.textContent="CANLI — 2D MOTOR ÇALIŞIYOR";raf=requestAnimationFrame(frame)}
function stop(){running=false;if(raf!==null)cancelAnimationFrame(raf);raf=null;statusEl.textContent="Durduruldu"}

function drawPitch(){
 ctx.clearRect(0,0,1100,680);ctx.fillStyle="#17633e";ctx.fillRect(0,0,1100,680);
 ctx.strokeStyle="rgba(255,255,255,.88)";ctx.lineWidth=3;ctx.strokeRect(50,40,1000,600);
 ctx.beginPath();ctx.moveTo(550,40);ctx.lineTo(550,640);ctx.stroke();
 ctx.beginPath();ctx.arc(550,340,90,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.arc(550,340,4,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
 ctx.strokeRect(50,210,140,260);ctx.strokeRect(910,210,140,260);ctx.strokeRect(50,275,55,130);ctx.strokeRect(995,275,55,130);
 ctx.strokeRect(20,290,30,100);ctx.strokeRect(1050,290,30,100);
}
function sx(x){return 50+x*(1000/PITCH.w)}function sy(y){return 40+y*(600/PITCH.h)}
function drawPlayer(p){
 const x=sx(p.x),y=sy(p.y),r=13,own=ball.owner===p.id;
 if(own){ctx.beginPath();ctx.arc(x,y,r+7,0,Math.PI*2);ctx.strokeStyle="#ffd84d";ctx.lineWidth=3;ctx.stroke()}
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=p.team==="HOME"?"#2584ff":"#e64747";ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle="#fff";ctx.font="bold 10px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(String(p.id),x,y);
}
function drawBall(){
 const x=sx(ball.x),y=sy(ball.y),s=Math.hypot(ball.vx,ball.vy);
 if(s>1){const k=Math.min(s*.012,25),d=s||1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-ball.vx/d*k,y-ball.vy/d*k);ctx.strokeStyle="rgba(255,255,255,.4)";ctx.lineWidth=3;ctx.stroke()}
 ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.strokeStyle="#111";ctx.lineWidth=2;ctx.stroke();
}
function render(){drawPitch();for(const p of players)drawPlayer(p);drawBall()}
function updateUI(){
 const s=Math.hypot(ball.vx,ball.vy);
 scoreEl.textContent=homeScore+" - "+awayScore;tickEl.textContent=tickCount.toString();ownerEl.textContent=ball.owner==null?"SAHİPSİZ":"#"+ball.owner;speedEl.textContent=s.toFixed(1);actionEl.textContent=lastAction;
 const op=ball.owner?player(ball.owner):null;
 logEl.textContent=[
   "Oyun süresi: "+Math.floor(clock/60)+":"+String(Math.floor(clock%60)).padStart(2,"0"),
   "Top: "+(ball.owner==null?"SERBEST":"#"+ball.owner+" "+(op?op.team:"")),
   "Top koordinatı: "+ball.x.toFixed(1)+", "+ball.y.toFixed(1),
   "Hız: "+s.toFixed(1),
   "Aksiyon: "+lastAction,
   lastEvent||""
 ].filter(Boolean).join("\n");
}
function fail(e){stop();errorEl.style.display="block";errorEl.textContent=e?.stack||String(e);console.error(e)}
function clearError(){errorEl.style.display="none";errorEl.textContent=""}

document.getElementById("start").onclick=start;
document.getElementById("stop").onclick=stop;
document.getElementById("step").onclick=tick;
document.getElementById("reset").onclick=reset;
reset();
</script>
</body>
</html>
